name: 测试并发布 NAS 镜像

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: nas-image-main
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  publish:
    name: 测试并构建 linux/amd64 镜像
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: 读取代码
        uses: actions/checkout@v6

      - name: 准备 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0

      - name: 准备 Python（原生依赖编译）
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: 准备 pnpm
        run: npm install --global pnpm@11.9.0

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 自动检查
        run: pnpm test

      - name: 代码检查
        run: pnpm lint

      - name: 读取发布版本
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: 准备 Docker 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub 容器仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建极空间镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          platforms: linux/amd64
          build-args: |
            APP_REVISION=${{ github.sha }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 验证最终容器
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker run -d --name ade-release-smoke --mount type=tmpfs,destination=/data --mount type=tmpfs,destination=/backups -e CHEF_PASSWORD= -p 127.0.0.1:4330:3000 "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4330/api/health > /tmp/ade-release-health.json; then
              jq -e --arg version "$RELEASE_VERSION" --arg revision "$GITHUB_SHA" '.ok == true and .version == $version and .revision == $revision' /tmp/ade-release-health.json
              curl -fsS http://127.0.0.1:4330/chef > /dev/null
              exit 0
            fi
            sleep 2
          done
          docker logs ade-release-smoke
          exit 1

      - name: 清理验收容器
        if: always()
        run: docker rm -f ade-release-smoke || true

      - name: 发布已验收镜像
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          docker push "${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA}"
          docker push "${REGISTRY}/${IMAGE_NAME}:${RELEASE_VERSION}"
          docker push "${REGISTRY}/${IMAGE_NAME}:latest"

      - name: 发布版本说明
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v${RELEASE_VERSION}"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "阿德小厨房 ${tag}" --notes-file RELEASE_NOTES.md
          fi
